<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="/packages/agentre-ui/src/engine/assets/images/logo-mark.svg"/>
    <title>agentre</title>
    <script>
      // Apply the saved dark theme before first paint to avoid a light flash.
      (function () {
        try {
          var theme = localStorage.getItem("agentre.theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          // localStorage can be blocked in embedded webviews.
        }
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
