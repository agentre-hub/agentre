message WorkspaceFsSearchFilesResponse { repeated WorkspaceFsSearchHit hits = 1; bool truncated = 2; }
message WorkspaceFsGitStateRequest { string root = 1; }
message WorkspaceFsGitStateResponse { bool not_a_repo = 1; string branch = 2; string worktree = 3; int32 dirty = 4; int32 ahead = 5; int32 behind = 6; bool has_upstream = 7; string common_dir = 8; }

// transcriptimport.* — reading a CLI's on-disk sessions back from a paired
// device. A new method family rather than fields on an existing one: an old
// agentred answers -32601 here, which the host shows as "unsupported", while
// extra fields on an existing family would be silently ignored and version
// skew would look exactly like "this machine has no sessions".
//
// Timestamps are unix milliseconds; 0 means "not on disk", never "now".
message TranscriptImportFilter {
  string cwd_prefix = 1;
  int64 since = 2;
  string title_query = 3;
  int32 limit = 4;
}

// backends empty means "every reader registered on that device".
message TranscriptImportScanRequest {
  repeated string backends = 1;
  TranscriptImportFilter filter = 2;
}

message TranscriptImportCandidate {
  string backend = 1;
  string provider_session_id = 2;
  string title = 3;
  string cwd = 4;
  int64 started_at = 5;
  int64 ended_at = 6;
  int32 turns = 7;
  string origin = 8;
  string locator = 9;
}

// status is "ok" or "unavailable" and is never empty: an empty candidate list
// has to carry its reason, because "asked and there are none" and "this
// machine cannot answer" are two different sentences in the UI. The third
// state, "unsupported", is device-level and is the host's reading of -32601 —
// a daemon that knows this method can never answer it.
message TranscriptImportBackendResult {
  string backend = 1;
  string status = 2;
  string reason = 3;
  repeated TranscriptImportCandidate candidates = 4;
}

message TranscriptImportScanResponse { repeated TranscriptImportBackendResult backends = 1; }

message TranscriptImportGap {
  string kind = 1;
  int32 count = 2;
  string detail = 3;
}

message TranscriptImportMeta {
  string backend = 1;
  string provider_session_id = 2;
  string title = 3;
  string cwd = 4;
  string model = 5;
  int32 turns = 6;
  int32 tool_calls = 7;
  int32 compactions = 8;
  int64 started_at = 9;
  int64 ended_at = 10;
  string origin = 11;
  repeated TranscriptImportGap gaps = 12;
}

message TranscriptImportOpenRequest {
  string backend = 1;
  string locator = 2;
}

message TranscriptImportOpenResponse { TranscriptImportMeta meta = 1; }

// start_index / max_turns page the replay. The reader streams turns one at a
// time and the daemon holds only the current page, so a transcript is never
// materialised whole — on either side of the wire.
message TranscriptImportTurnsRequest {
  string backend = 1;
  string locator = 2;
  int32 start_index = 3;
  int32 max_turns = 4;
}

message TranscriptImportImage {
  string media_type = 1;
  string url = 2;
  bytes inline = 3;
}

// events reuses RuntimeEventNotification purely as the sealed-event envelope:
// it is the one per-field codec for agentruntime events, and a second copy of
// that 27-branch oneof would drift. conversation_id / seq are unused here.
message TranscriptImportTurn {
  int32 index = 1;
  string user_text = 2;
  repeated TranscriptImportImage user_images = 3;
  repeated RuntimeEventNotification events = 4;
  Usage usage = 5;
  string model = 6;
  int64 started_at = 7;
  int64 ended_at = 8;
  string fork_anchor = 9;
  string error_text = 10;
}

// has_more is answered by the daemon, not inferred from a short page: a page
// cut short by the byte budget is also short, but there is more after it.
message TranscriptImportTurnsResponse {
  repeated TranscriptImportTurn turns = 1;
  int32 next_index = 2;
  bool has_more = 3;
}

// transcriptimport.execute runs the import on the machine that holds the
// transcript: it writes the session row and appends the replayed turns to the
// notification journal, so an ordinary SESSION_LIST / SESSION_PULL serves the
// imported session like any other. agentre-server never owns sessions, it
// mirrors them — so importing from the web console has to happen here.
//
// conversation_id is minted by the caller (same rule as runtime.run: the
// originator mints the conversation's UUID and the daemon never issues one).
// Title, cwd and the provider session id are NOT inputs: they are the
// transcript's own facts, read here and written down.
message TranscriptImportExecuteRequest {
  string backend = 1;
  string locator = 2;
  string conversation_id = 3;
  int64 agent_id = 4;
  string agent_sync_id = 5;
  string peer_fingerprint = 6;
}

// already_imported means this provider session already has a session under that
// peer: conversation_id is the one in the database (not necessarily the minted
// one) and turns is 0 — nothing was appended. Re-importing is a normal branch,
// not an error.
message TranscriptImportExecuteResponse {
  string conversation_id = 1;
  string provider_session_id = 2;
  string cwd = 3;
  string title = 4;
  int32 turns = 5;
  bool already_imported = 6;
}

message RuntimeEventNotification {
  string conversation_id = 1;
  int64 seq = 2;

  oneof event {
    TextDelta text_delta = 3;
    ThinkingDelta thinking_delta = 4;
    OutputActivity output_activity = 5;
    PermissionModeChanged permission_mode_changed = 6;
    Retry retry = 7;
    ContextWindowUpdated context_window_updated = 8;
    CompactBoundary compact_boundary = 9;
    RuntimeStatus runtime_status = 10;
    Done done = 11;
    ErrorEvent error = 12;
    UserMessage user_message = 13;
    ToolCall tool_call = 14;
    ToolResult tool_result = 15;
    SteerConsumed steer_consumed = 16;
    UserAskRequest user_ask_request = 17;
    UserAskResolved user_ask_resolved = 18;
    ToolPermissionRequest tool_permission_request = 19;
    ToolPermissionResolved tool_permission_resolved = 20;
    ExecApprovalRequested exec_approval_requested = 21;
    ExecApprovalResolved exec_approval_resolved = 22;
    SubagentEvent subagent_started = 23;
    SubagentEvent subagent_progress = 24;
    SubagentEvent subagent_done = 25;
    SubagentModel subagent_model = 26;
    UsageUpdate usage_update = 27;
    PlanUpdated plan_updated = 28;
    UnrecognizedBlock unrecognized_block = 29;
  }
}

message TextDelta {
  string text = 1;
}

message ThinkingDelta { string text = 1; }
message OutputActivity {}
message PermissionModeChanged { string mode = 1; }
message Retry {
  string message = 1;
  string details = 2;
  int32 attempt = 3;
  int32 max = 4;
}
message ContextWindowUpdated { int32 tokens = 1; }
message CompactBoundary {
  int32 pre_tokens = 1;
  int32 post_tokens = 2;
  string trigger = 3;
  int32 duration_ms = 4;
}
message RuntimeStatus { string status = 1; }
// Done ends a turn. The fields are that turn's stats, filled by whoever ends
// the turn above the runtime — a desktop's chat_svc, which has them at hand
// (it computed them and wrote them to its own database). A runtime's own Done
// leaves them zero, and zero reads as "not reported", never as "took 0ms".
//
// agentred fills the same four on RunResultDoneNotification instead: it meters
// the event stream it fans out, and by the time it knows the numbers the Done
// event is long gone. Two producers, two carriers each can actually fill, one
// landing place — the shared transcript projector's done branch.
message Done {
  string model = 1;
  int32 duration_ms = 2;
  int32 first_token_ms = 3;
  double tokens_per_sec = 4;
}
message ErrorEvent { string message = 1; }
message UserMessage {
  string text = 1;
  string source_device = 2;
  string source_device_name = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 reasoning_tokens = 3;
  int32 cached_tokens = 4;
  int32 cache_creation_tokens = 5;
  int32 total_tokens = 6;
}

message RunResultDoneNotification {
  string conversation_id = 1;
  int64 seq = 2;
  string provider_session_id = 3;
  Usage usage = 4;
  string user_anchor = 5;
  string model = 6;
  int32 context_window = 7;
  uint64 turn_token = 8;
  string stop_error_message = 9;
  int32 stop_error_code = 10;
  // This turn's stats, measured by the daemon over the very event stream it
  // fanned out. Consumers that build a transcript from frames (the browser
  // console, a peer view) have no other source: the numbers the desktop shows
  // for its own sessions are computed above the runtime, in chat_svc, and land
  // in its local database. Same yardstick on both sides — internal/pkg/turnstats
  // owns it. duration_ms is wall clock and includes tool gaps; tokens_per_sec
  // divides the turn's summed completion tokens by generation time only.
  int32 duration_ms = 11;
  int32 first_token_ms = 12;
  double tokens_per_sec = 13;
}

message AutonomousTurnStartedNotification {
  string conversation_id = 1;
  int64 seq = 2;
  string trigger = 3;
  uint64 turn_token = 4;
}

message ToolCall {
  string id = 1;
  string name = 2;
  bytes input = 3;
  bytes canonical = 4;
  string parent_tool_call_id = 5;
  string subagent_run_id = 6;
}
message ToolResult {
  string tool_call_id = 1;
  string content = 2;
  bool is_error = 3;
  string parent_tool_call_id = 4;
  string subagent_run_id = 5;
  bytes meta = 6;
}
message ConsumedSteer {
  string queued_id = 1;
  string text = 2;
  string source_peer = 3;
  string source_name = 4;
}
message SteerConsumed { repeated ConsumedSteer steers = 1; }
message AskOption { string label = 1; string description = 2; string preview = 3; }
message AskQuestion {
  string id = 1;
  string question = 2;
  string header = 3;
  bool multi_select = 4;
  bool is_other = 5;
  bool is_secret = 6;
  repeated AskOption options = 7;
}
message AskAnswer { int32 question_index = 1; repeated string labels = 2; string other_text = 3; }
message UserAskRequest { string request_id = 1; string tool_call_id = 2; string parent_tool_call_id = 3; repeated AskQuestion questions = 4; }
message UserAskResolved { string request_id = 1; string parent_tool_call_id = 2; repeated AskAnswer answers = 3; bool skipped = 4; }
message ToolPermissionRequest { string request_id = 1; string tool_call_id = 2; string tool_name = 3; bytes input = 4; }
message ToolPermissionResolved { string request_id = 1; bool allowed = 2; bool always_allow = 3; string deny_reason = 4; }
message ExecApprovalRequested {
  string id = 1; string command_text = 2; string command_preview = 3;
  repeated string allowed_decisions = 4; string host = 5; string node_id = 6;
  string agent_id = 7; string session_key = 8; int64 created_at_ms = 9; int64 expires_at_ms = 10;
}
message ExecApprovalResolved { string id = 1; string status = 2; string decision = 3; string resolved_by = 4; int64 resolved_at_ms = 5; }
message SubagentRun {
  string id = 1; int32 index = 2; string agent = 3; string profile = 4; string agent_source = 5;
  string task = 6; string requested_model = 7; string model = 8; string status = 9;
  string last_tool_name = 10; int32 tool_uses = 11; string summary = 12; string error_message = 13;
}
message SubagentInfo {
  string task_id = 1; string subagent_type = 2; string kind = 3; string task_description = 4;
  string prompt = 5; string last_tool_name = 6; int32 tool_uses = 7; int32 total_tokens = 8;
  int32 duration_ms = 9; string status = 10; string mode = 11; repeated SubagentRun runs = 12;
  // summary is the task's own conclusion (claudecode task_notification.summary):
  // the subagent's report on success, the interruption reason on failure. Runs-less
  // producers carry their conclusion here and nowhere else — a resumed run has no
  // tool_result of its own, so dropping this loses the report entirely.
  string summary = 13;
}
message SubagentEvent { string tool_call_id = 1; SubagentInfo info = 2; }
message SubagentModel { string tool_call_id = 1; string model = 2; }
message UsageUpdate { Usage usage = 1; int32 total_input_tokens = 2; int32 context_window = 3; }
message PlanStep { string id = 1; string step = 2; string status = 3; }
message PlanAction { string id = 1; string kind = 2; bool requires_feedback = 3; }
message PlanUpdated { repeated PlanStep steps = 1; string text = 2; repeated PlanAction actions = 3; }

// UnrecognizedBlock carries a persisted transcript block that the sending host
// has no projection for, verbatim. It exists so "I cannot read this" survives
// the wire instead of being dropped: the receiver may be a newer build that
// does understand block_type, and even when it is not, showing an opaque block
// beats silently losing a piece of the transcript.
//
// data is the block's payload bytes exactly as stored — never reserialized,
// never interpreted by the sender.
message UnrecognizedBlock {
  string block_type = 1;
  bytes data = 2;
}
