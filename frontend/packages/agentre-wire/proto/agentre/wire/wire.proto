message WireFrame {
  oneof body {
    Notification notification = 1;
  }
}

message RpcFrame {
  uint64 id = 1;

  oneof body {
    Request request = 2;
    Response response = 3;
    RpcNotification notification = 4;
    RpcError error = 5;
    Cancel cancel = 6;
  }
}

message RpcNotification {
  oneof payload {
    RuntimeEventNotification runtime_event = 1;
    RunResultDoneNotification run_result_done = 2;
    AutonomousTurnStartedNotification autonomous_turn_started = 3;
    RuntimeEventNotification autonomous_turn_event = 4;
    RunResultDoneNotification autonomous_turn_done = 5;
    TerminalDataNotification terminal_data = 6;
    TerminalExitNotification terminal_exit = 7;
  }
}

message Request {
  uint32 method_id = 1;
  bytes encoded_payload = 2;
}

message Response {
  uint32 method_id = 1;
  bytes encoded_payload = 2;
}

message RpcError {
  int32 code = 1;
  string message = 2;
  bytes details = 3;
}

message Cancel {
  uint64 request_id = 1;
}

message Notification {
  oneof payload {
    AccountSyncVersion account_sync_version = 1;
    AccountMirrorChanged account_mirror_changed = 2;
    AccountDevicePresence account_device_presence = 3;
  }
}

message AccountSyncVersion {
  uint64 version = 1;
}

message AccountMirrorChanged {}

message AccountDevicePresence {}

message AuthAccountRequest {
  string credential = 1;
  // 2 曾是 device_fingerprint:调用方自报的对端身份。它从来没有被任何东西验证过,
  // 而对端身份现在只从已验签的凭据的 pfp claim 取(见 AuthAccountResponse
  // .peer_fingerprint)。留一个「说了不算」的字段是下一个人踩的坑,故删而不是忽略。
  reserved 2;
  reserved "device_fingerprint";
  // The wire protocol version the caller speaks — @agentre-hub/agentre-wire's
  // package version.
  string protocol_version = 3;
  // The oldest wire protocol version the caller still accepts from the peer.
  // Together with protocol_version this names the caller's [min_supported,
  // protocol] window; wireversion.Match checks each side's protocol_version
  // falls within the other side's window.
  string min_supported_protocol_version = 4;
}

message AuthAccountResponse {
  bool ok = 1;
  string instance_uuid = 2;
  // The wire protocol version the daemon speaks.
  string protocol_version = 3;
  // The oldest wire protocol version the daemon still accepts from the peer.
  string min_supported_protocol_version = 4;
  // The identity the responder assigned to the caller, read out of the caller's
  // verified credential. The caller records it as its own identity on this
  // connection: it is the value the responder files the caller's sessions
  // under, and therefore the conversation_id derivation input. The caller must
  // not re-derive it by parsing its own credential — that assumes both ends
  // read the claim identically forever, and a divergence would make
  // conversation_id silently wrong.
  string peer_fingerprint = 5;
}

