// SessionListRequest narrows the machine's session list at the source. Without
// a keyword the peer answers with every session it holds, which is what makes
// the machine axis expensive: the caller only wants the ones it is looking for.
message SessionListRequest {
  // keyword narrows the list. The guaranteed floor is a case-insensitive
  // substring match on SessionSummary.title; a host may additionally match the
  // grouping names it owns (the desktop matches agent and project names, which
  // agentred does not have — it stores agent_sync_id / project_sync_id, not
  // names). Empty = no narrowing, the previous behaviour.
  string keyword = 1;
}

message SessionListResponse {
  repeated SessionSummary sessions = 1;
}

message SessionSummary {
  string conversation_id = 1;
  string peer_fingerprint = 2;
  int64 agent_id = 3;
  string title = 4;
  string agent_sync_id = 5;
  string provider_session_id = 6;
  string cwd = 7;
  string project_sync_id = 8;
  string backend_type = 9;
  string lifecycle_state = 10;
  bool waiting_for_input = 11;
  int64 latest_seq = 12;
  int64 last_message_at = 13;
  string provider_key = 14;
  string model_key = 15;
  // reasoning_effort is the thinking effort this peer recorded for the session
  // (one of "", low, medium, high, xhigh, max). Empty means "follow the backend
  // configuration" — a meaningful value, not "unknown". Display only: the
  // executing path takes the effort off the run request, never off this column.
  string reasoning_effort = 16;
}

// ActivityRollup is the counts-only channel behind the account's activity
// statistics. The peer answers with day x dimension counts and nothing else:
// no titles, no paths, no cwd, no conversation content. That boundary is the
// feature's promise to the user, not an implementation detail — the peer
// aggregates before answering so the caller never sees a raw session row.
//
// The server pulls it the same way it pulls session.list. "Backfill" is not a
// separate mode: it is one call with an empty since_day.
message ActivityRollupRequest {
  // Inclusive lower bound, "YYYY-MM-DD" in time_zone, compared against the day
  // a session was *created*. Empty asks for everything this machine has.
  // Inclusive because today's count still changes during the day — an exclusive
  // bound would permanently lose the last day.
  string since_day = 1;
  // IANA zone name the caller wants days bucketed in (the server's own zone, so
  // every machine of an account lands on one set of day boundaries regardless of
  // where it sits). Empty or unloadable falls back to UTC.
  string time_zone = 2;
}

// ActivityDailyBucket is one day's session count under one dimension combo. A
// session lands in exactly one combo, so summing over any subset of dimensions
// is correct. Empty dimension values are meaningful, not missing: empty
// provider_key + model_key means "follows the agent binding", empty
// project_sync_id means "no project".
message ActivityDailyBucket {
  // The day the counted sessions were **created**, not the day they were last
  // active. A creation day never moves, so a day's count is final once written:
  // an incremental pull and a full backfill of the same machine produce the same
  // history. Bucketing by last activity would move a session from day to day as
  // it is continued, while the incremental lower bound advances past the days it
  // left behind — one conversation worked on for thirty days would be stored as
  // thirty separate counts of one.
  string day = 1;
  string agent_sync_id = 2;
  string backend_type = 3;
  string provider_key = 4;
  string model_key = 5;
  string project_sync_id = 6;
  int32 session_count = 7;
}

message ActivityRollupResponse { repeated ActivityDailyBucket buckets = 1; }

message SessionAttachRequest {
  string conversation_id = 1;
  string peer_fingerprint = 2;
}

message SessionAttachResponse {
  string conversation_id = 1;
