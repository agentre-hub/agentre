message RuntimeRunRequest {
  AgentBackend backend = 1;
  int64 agent_id = 2;
  string conversation_id = 3;
  string peer_fingerprint = 4;
  string cwd = 5;
  string title = 6;
  string agent_sync_id = 7;
  string system_prompt = 8;
  string provider_session_id = 9;
  bool fresh_session = 10;
  string user_text = 11;
  repeated StoredBlock user_blocks = 12;
  repeated HistoryMessage history = 13;
  bool compact = 14;
  string fork_anchor = 15;
  string permission_mode = 16;
  string collaboration_mode = 17;
  repeated MCPServer mcp_servers = 18;
  map<string, bool> enabled_plugins = 19;
  string llm_provider_key = 20;
  string llm_model_key = 21;
  string source_device = 22;
  string source_device_name = 23;
  // project_sync_id is the account-level sync id of the project this session
  // belongs to. The originator reports it at start; the daemon overwrites it
  // idempotently every turn, alongside title and agent_sync_id.
  //
  // It is reported rather than derived because the daily activity rollup groups
  // by project while carrying no paths at all — deriving the project from cwd is
  // not available on that channel. Empty means the originator did not report one
  // (no project, or an older client), not "unknown, derive it".
  string project_sync_id = 24;
  // reasoning_effort is this turn's effective thinking effort, carried as its
  // own run parameter next to llm_provider_key / llm_model_key rather than
  // inside the backend payload: a browser dispatch sends a stub backend that
  // carries no configuration at all, so the payload route is always empty
  // there. Empty means the caller stated nothing — the executor then falls back
  // to the backend payload's own effort, so an older desktop keeps running on
  // its configured level instead of being read as "the user chose the default".
  string reasoning_effort = 25;
}
message RuntimeRunResponse {
  string conversation_id = 1;
  string provider_session_id = 2;
  string launch_permission_mode = 3;
  string provider_fallback_key = 4;
