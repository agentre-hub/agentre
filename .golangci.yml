version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - gosec
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - staticcheck

  settings:
    gosec:
      excludes:
        - G106
        - G115
        - G117
        - G301
        - G302
        - G306
        - G401
        - G402
        - G404
        - G501
        - G505
    misspell:
      locale: US

  exclusions:
    paths:
      - .claude
      - .dev-kit
      - frontend
      # gitignored 的运行期证据目录(一次性探针 Go 程序),不是生产代码。
      - e2e/scratch

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/agentre-hub/agentre
  exclusions:
    paths:
      - .claude
      - .dev-kit
      - frontend
      # 同上:gitignored 的运行期证据目录不该被格式检查扫到。
      - e2e/scratch

run:
  timeout: 10m
