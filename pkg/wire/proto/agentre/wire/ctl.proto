syntax = "proto3";

package agentre.wire;

option go_package = "github.com/agentre-hub/agentre/pkg/wire/agentrewire;agentrewire";

// ctl.proto 是 agrctl 资源管理的请求/响应契约：agrctl 客户端是唯一的生产方，桌面端与
// agentre-server 两个执行者是消费方。两个执行者分属两个 Go module，互相不能 import，
// 所以契约住在它们共同依赖的协议 module 里。
//
// 分工（spec 决策 7）：名字/路径解析、flag 解析、输出格式与 help 都只在 agrctl 里实现；
// 执行者只接受**按 id** 的操作和字段集合，变更清单里每个字段的前后值由执行者对照自己的
// 当前数据计算——客户端给的值只是「要改成什么」，从不被当作「原来是什么」。
//
// 传输：JSON（protojson，camelCase 字段名）经 HTTP `POST /ctl/v1/resources`，请求体是
// CtlRequest、成功响应体是 CtlResponse；失败时非 2xx，响应体为 `{"error":"<消息>"}`，
// 消息原样展示给用户。
//
// 密钥：CtlProvider.api_key 与 CtlBackend.token 在写请求里是明文，在任何响应里都不得是
// 明文——api_key 只回掩码，token 只回 token_set。

// CtlKind 是 agrctl 能管理的资源类型。
enum CtlKind {
  CTL_KIND_UNSPECIFIED = 0;
  CTL_KIND_AGENT = 1;
  CTL_KIND_DEPARTMENT = 2;
  CTL_KIND_PROJECT = 3;
  CTL_KIND_PROVIDER = 4;
  // 模型是提供方下的子资源（spec 决策 9）。
  CTL_KIND_MODEL = 5;
  CTL_KIND_BACKEND = 6;
}

// CtlOp 是写操作的种类。
enum CtlOp {
  CTL_OP_UNSPECIFIED = 0;
  CTL_OP_CREATE = 1;
  CTL_OP_UPDATE = 2;
  CTL_OP_DELETE = 3;
}

// CtlCaller 是 agrctl 对调用方的分类，执行者据此决定审批方式：
//   - SESSION：环境变量里带着会话级 token（Agentre 会话里的 agent）→ 在该会话里审批；
//   - EXTERNAL：用本机握手 token、stdin 不是 TTY（外部 AI/脚本）→ 桌面端弹窗审批；
//   - HUMAN：用本机握手 token、stdin 是 TTY（人在终端里）→ 直接执行。
// 这是护栏级的分类：同一系统用户下的程序可以伪造，执行者不得把它当作鉴权。
enum CtlCaller {
  CTL_CALLER_UNSPECIFIED = 0;
  CTL_CALLER_SESSION = 1;
  CTL_CALLER_EXTERNAL = 2;
  CTL_CALLER_HUMAN = 3;
}

// CtlAgent 是一个 Agent。
message CtlAgent {
  int64 id = 1;
  string name = 2;
  string description = 3;
  // 0 = 不属于任何部门。
  int64 department_id = 4;
  // 执行目标（按顺序的后端 id）。写入时整体替换。
  repeated int64 backend_ids = 5;
  bool pinned = 6;
  string avatar_color = 7;
  string avatar_icon = 8;
  // 只读：非空表示系统 Agent。
  string system_badge = 9;
}

// CtlDepartment 是一个部门；名字只在同一父部门下唯一。
message CtlDepartment {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string accent_color = 5;
  // 0 = 顶层部门。
  int64 parent_id = 6;
  // 0 = 未指定负责人。
  int64 lead_agent_id = 7;
}

// CtlProjectLocation 是项目在某台设备上的路径（只读）。
message CtlProjectLocation {
  string device_id = 1;
  string device_name = 2;
  string path = 3;
}

// CtlProject 是一个项目；名字只在同一父项目下唯一。
message CtlProject {
  int64 id = 1;
  // 0 = 顶层项目。
  int64 parent_id = 2;
  string name = 3;
  string icon = 4;
  string color = 5;
  string description = 6;
  // 执行者本机上的路径。
  string path = 7;
  // 成员 Agent。创建时是初始成员；更新时用 CtlWriteRequest 的 add/remove 字段增减。
  repeated int64 member_agent_ids = 8;
  // 只读：各设备上的路径。
  repeated CtlProjectLocation locations = 9;
}

// CtlProvider 是一个 LLM 提供方。
message CtlProvider {
  int64 id = 1;
  string name = 2;
  string type = 3;
  string base_url = 4;
  bool enabled = 5;
  // 写入时是明文；响应里只能是掩码（前 4 位、圆点、后 4 位），未设置时为空。
  string api_key = 6;
  // 只读：是否已设置 API key。
  bool api_key_set = 7;
  // 默认模型的 key。
  string default_model_key = 8;
  // 只读：引用它的后端数。
  int32 backend_refs = 9;
}

// CtlModel 是提供方下的一个模型，用 `提供方/模型key` 定位。
message CtlModel {
  int64 id = 1;
  int64 provider_id = 2;
  string key = 3;
  string model_id = 4;
  string name = 5;
  int64 context_window = 6;
  int64 max_output = 7;
  bool enabled = 8;
  // 读：是否为所属提供方的默认模型。写：true 表示把它设为默认模型。
  bool is_default = 9;
  // 只读：引用它的后端数。
  int32 backend_refs = 10;
}

// CtlBackend 是一个 Agent 后端。
message CtlBackend {
  int64 id = 1;
  string name = 2;
  // 创建后不可改。
  string type = 3;
  // 绑定的提供方；0 = CLI 自身登录态（native）。
  int64 provider_id = 4;
  // 固定模型；0 = 跟随提供方的默认模型。
  int64 model_id = 5;
  // 目标设备：已配对设备的名字或设备指纹，空 = 本机。设备不属于 ctl 管理的资源，
  // 由执行者解析。
  string device = 6;
  string cli_path = 7;
  string reasoning_effort = 8;
  map<string, string> env = 9;
  // 该后端类型独占的设置，形如同步契约的 AgentBackendConfig（camelCase 键的 JSON 对象）。
  // 写入时 update 只替换其中出现的键。
  string config_json = 10;
  // 只写：openclaw 网关 token 的明文；响应里恒为空。
  string token = 11;
  // 只读：token 是否已设置。
  bool token_set = 12;
}

// CtlResource 是任意一类资源的文档。
message CtlResource {
  oneof doc {
    CtlAgent agent = 1;
    CtlDepartment department = 2;
    CtlProject project = 3;
    CtlProvider provider = 4;
    CtlModel model = 5;
    CtlBackend backend = 6;
  }
}

// CtlListRequest 列出某类资源的全部条目；过滤在客户端做。
message CtlListRequest {
  CtlKind kind = 1;
}

message CtlListResponse {
  repeated CtlResource items = 1;
}

// CtlGetRequest 按 id 取一条资源的详情（含只读的关联信息）。
message CtlGetRequest {
  CtlKind kind = 1;
  int64 id = 2;
}

message CtlGetResponse {
  CtlResource resource = 1;
}

// CtlWriteRequest 是一次按 id 的写操作。
message CtlWriteRequest {
  CtlOp op = 1;
  CtlKind kind = 2;
  // update / delete 的目标 id；create 时为 0。
  int64 id = 3;
  // create / update 的字段值。只有 fields 里列出的字段有效，其余一律忽略。
  CtlResource resource = 4;
  // 本次写入的字段集合：该资源文档里字段的 JSON 名（如 "departmentId"、"backendIds"）。
  // update 只修改这些字段。
  repeated string fields = 5;
  // 仅 project update：增减成员 Agent。
  repeated int64 add_member_agent_ids = 6;
  repeated int64 remove_member_agent_ids = 7;
  // 仅 department delete：连同子部门和 Agent 一起删除；否则把它们上移到父部门。
  bool cascade = 8;
  // 仅 provider / model delete：仍被后端引用时也删除。
  bool force = 9;
  CtlCaller caller = 10;
  // 完整命令行（密钥值已替换为 …），供审批卡展示。
  string command = 11;
}

// CtlFieldChange 是一个字段的变更；before/after 缺席表示「没有」（创建时无 before，
// 删除时无 after）。secret 为 true 时两者都缺席，只表示该密钥被写入。
message CtlFieldChange {
  string field = 1;
  optional string before = 2;
  optional string after = 3;
  bool secret = 4;
}

// CtlChange 是一条资源的变更，由执行者对照当前数据计算。
message CtlChange {
  CtlOp op = 1;
  CtlKind kind = 2;
  int64 id = 3;
  string name = 4;
  repeated CtlFieldChange fields = 5;
  // 附注，例如级联删除波及的子资源。
  string note = 6;
}

message CtlWriteResponse {
  // 被写入资源的 id 与名字（create 时是新 id）。
  int64 id = 1;
  string name = 2;
  repeated CtlChange changes = 3;
}

// CtlRequest 是 `POST /ctl/v1/resources` 的请求体。
message CtlRequest {
  oneof op {
    CtlListRequest list = 1;
    CtlGetRequest get = 2;
    CtlWriteRequest write = 3;
  }
}

// CtlResponse 是 `POST /ctl/v1/resources` 的成功响应体，分支与请求一一对应。
message CtlResponse {
  oneof result {
    CtlListResponse list = 1;
    CtlGetResponse get = 2;
    CtlWriteResponse write = 3;
  }
}
