name: Release

on:
  push:
    tags:
      - "v*"

env:
  VERSION: ${{ github.ref_name }}
  COMMIT_ID: ${{ github.sha }}
  NODE_OPTIONS: --max-old-space-size=4096
  # agentred 容器镜像。GHCR 的 owner 段必须全小写，写死避免大小写踩坑
  IMAGE: ghcr.io/agentre-hub/agentred

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            platform: linux-amd64
            webkit_pkg: libwebkit2gtk-4.0-dev
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            platform: linux-arm64
            webkit_pkg: libwebkit2gtk-4.1-dev
            extra_tags: "webkit2_41"
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
            platform: windows-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (macOS)
        if: matrix.goos == 'darwin'
        run: |
          rm -rf ~/Library/Android/sdk || true
          rm -rf ~/Library/Developer/CoreSimulator || true
          rm -rf ~/Library/Caches/Homebrew || true
          rm -rf /Users/runner/hostedtoolcache || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/chromium || true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ${{ matrix.webkit_pkg || 'libwebkit2gtk-4.0-dev' }}

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH

      - name: Prepare isolated keychain (Linux)
        if: matrix.goos == 'linux'
        env:
          AGENTRE_KEYCHAIN_DIR: ${{ runner.temp }}/agentre-build-keychain
        run: |
          mkdir -m 700 "$AGENTRE_KEYCHAIN_DIR"
          echo "AGENTRE_KEYCHAIN_DIR=$AGENTRE_KEYCHAIN_DIR" >> "$GITHUB_ENV"

      - name: Build desktop app
        if: matrix.goos != 'windows'
        run: |
          if [ -n "${{ matrix.extra_tags }}" ]; then
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -ldflags="-s -w -X github.com/cago-frame/cago/configs.Version=${{ env.VERSION }} -X github.com/agentre-hub/agentre/internal/buildinfo.CommitID=${{ env.COMMIT_ID }}" -tags "${{ matrix.extra_tags }}"
          else
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -ldflags="-s -w -X github.com/cago-frame/cago/configs.Version=${{ env.VERSION }} -X github.com/agentre-hub/agentre/internal/buildinfo.CommitID=${{ env.COMMIT_ID }}"
          fi

      - name: Build desktop app (Windows)
        if: matrix.goos == 'windows'
        run: wails build -nsis -platform ${{ matrix.goos }}/${{ matrix.goarch }} -ldflags="-s -w -X github.com/cago-frame/cago/configs.Version=${{ env.VERSION }} -X github.com/agentre-hub/agentre/internal/buildinfo.CommitID=${{ env.COMMIT_ID }}"

      - name: Import Apple certificate
        if: matrix.goos == 'darwin'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "No Apple certificate configured, skipping"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign macOS app
        if: matrix.goos == 'darwin'
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --deep --sign "$SIGNING_IDENTITY" --options runtime --entitlements build/darwin/entitlements.plist build/bin/Agentre.app
          else
            codesign --force --deep --sign - build/bin/Agentre.app
          fi

      - name: Package (macOS dmg)
        if: matrix.goos == 'darwin'
        run: |
          DMG_SRC=$(mktemp -d)
          cp -R build/bin/Agentre.app "$DMG_SRC/"
          ln -s /Applications "$DMG_SRC/Applications"
          hdiutil create -volname "Agentre" -srcfolder "$DMG_SRC" -ov -format UDZO agentre-${VERSION}-${{ matrix.platform }}.dmg
          rm -rf "$DMG_SRC"

      - name: Notarize macOS DMG
        if: matrix.goos == 'darwin'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No signing identity, skipping notarization"
            exit 0
          fi
          xcrun notarytool submit agentre-${VERSION}-${{ matrix.platform }}.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple agentre-${VERSION}-${{ matrix.platform }}.dmg

      - name: Package (Linux deb)
        if: matrix.goos == 'linux'
        run: |
          PKG_ROOT=pkg-deb
          mkdir -p ${PKG_ROOT}/DEBIAN
          mkdir -p ${PKG_ROOT}/usr/bin
          mkdir -p ${PKG_ROOT}/usr/share/applications
          mkdir -p ${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps
          # 桌面二进制小写命名，便于内置 update_svc 解压后查找。
          cp build/bin/Agentre ${PKG_ROOT}/usr/bin/agentre
          cp build/appicon.png ${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps/agentre.png
          cat > ${PKG_ROOT}/DEBIAN/control << CTRL
          Package: agentre
          Version: $(echo "${VERSION#v}" | tr '-' '~')
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.goarch }}
          Maintainer: agentre
          Description: AgentRe desktop application
          CTRL
          sed -i 's/^          //' ${PKG_ROOT}/DEBIAN/control
          cat > ${PKG_ROOT}/usr/share/applications/agentre.desktop << DESK
          [Desktop Entry]
          Name=Agentre
          Exec=/usr/bin/agentre
          Icon=agentre
          Type=Application
          Categories=Utility;
          DESK
          sed -i 's/^          //' ${PKG_ROOT}/usr/share/applications/agentre.desktop
          dpkg-deb --build ${PKG_ROOT} agentre-${VERSION}-${{ matrix.platform }}.deb

      - name: Package (Windows installer)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Move-Item "build\bin\Agentre-${{ matrix.goarch }}-installer.exe" "agentre-$($env:VERSION)-${{ matrix.platform }}-installer.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: release-agentre-${{ matrix.platform }}
          path: agentre-${{ env.VERSION }}-${{ matrix.platform }}*

  build-agentred:
    name: agentred (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - goos: linux
            goarch: amd64
            platform: linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
          - goos: windows
            goarch: amd64
            platform: windows-amd64
          - goos: windows
            goarch: arm64
            platform: windows-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and package agentred
        run: |
          make agentred-package \
            VERSION="${VERSION}" \
            COMMIT_ID="${COMMIT_ID}" \
            AGENTRED_GOOS=${{ matrix.goos }} \
            AGENTRED_GOARCH=${{ matrix.goarch }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-agentred-${{ matrix.platform }}
          path: build/agentred-dist/*

  release:
    name: Create Release
    needs: [build-desktop, build-agentred]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Add installers and generate compatibility checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 artifacts/
          cd artifacts
          sha256sum * > SHA256SUMS
          cp SHA256SUMS SHA256SUMS.txt
          cmp SHA256SUMS SHA256SUMS.txt

      - name: Determine prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-beta* ]] || [[ "${{ github.ref_name }}" == *-rc* ]]; then
            echo "flag=--prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ github.ref_name }} -y 2>/dev/null || true
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.prerelease.outputs.flag }} \
            artifacts/*

      - name: Upload release info for mirror fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} > release-info.json
          gh release upload ${{ github.ref_name }} release-info.json --clobber

  # agentred 容器镜像：从源码构建（Dockerfile 默认目标），CLI 版本由 Dockerfile 钉死。
  # 与二进制产物并行，互不阻塞——镜像挂了不该拦住 Release 里的桌面包。
  build-agentred-image:
    name: agentred image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个原生 runner 各打一个架构，不走 QEMU：镜像里要装三个 CLI 并逐个
          # 跑版本自证，模拟环境下既慢又容易在自证那步无谓地红。
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # 单架构产物先按 digest 推上去，tag 由 merge job 一次性挂到 manifest list。
          # provenance 关掉：开着会让每个架构自己变成一个 index，合并时 digest 对不上。
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=agentred-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agentred-release-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-agentred-image:
    name: Publish agentred manifest
    needs: [build-agentred-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: release-image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 在 shell 里拼、也在 shell 里用：不绕 step output，省掉一次把 tag 名
      # 插回 run 脚本的 ${{ }} 展开
      - name: Create manifest list and push
        working-directory: digests
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAGS=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:sha-${SHORT}")
          # 预发布不动 latest：latest 是「拿来就能上生产的那一版」，beta/rc 不是
          case "$VERSION" in
            *-beta*|*-rc*) ;;
            *) TAGS+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
