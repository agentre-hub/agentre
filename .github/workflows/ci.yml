name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to match local dev (reproducible + stable action cache).
          version: v2.12.2

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Test backend
        env:
          # Bootstrap claims relative backends against the local device identity.
          # Linux hosted runners do not provide a Secret Service keychain.
          AGENTRE_KEYCHAIN_DIR: ${{ runner.temp }}/agentre-test-keychain
        run: |
          mkdir -m 700 "$AGENTRE_KEYCHAIN_DIR"
          make test-backend

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Lint
        run: cd frontend && pnpm run lint

  wire-proto:
    name: Wire Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      # Lints the schema, rejects wire-incompatible changes against the frozen
      # baseline, regenerates, and requires the checked-in TS/Go products —
      # including the desktop's internal copy — to already match.
      - name: Check wire protobuf
        run: cd frontend/packages/agentre-wire && pnpm run proto:check

  mocks:
    name: Mocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # 仓库里 60+ 条 //go:generate 走的是 PATH 上的裸 mockgen,没有任何地方钉版本 ——
      # 谁的机器装了什么版本,产出就是什么形态。这里钉的是**事实上的**那个版本:
      # 52 份 checked-in 产物由它逐字节复现。
      #
      # 没有这道守卫时,一份 v0.4.0 生成的产物(v0.5.0 起 mock 多了 isgomock 字段)
      # 在 dev 上躺了两天没有任何地方变红,直到有人跑 make mock 才发现工作区脏了。
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Regenerate mocks
        run: make mock
      # 重新生成必须是空操作。有 diff 就说明 checked-in 的那份不是当前接口 + 当前
      # 生成器的产物 —— 要么忘了跑 make mock,要么用了别的版本。
      - name: Require checked-in mocks to already match
        run: git diff --exit-code

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails
          key: ${{ runner.os }}-wails-v2.12.0
      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        env:
          # The bindings helper executes main(), including bootstrap. Keep its
          # device identity inside the runner instead of requiring Secret Service.
          AGENTRE_KEYCHAIN_DIR: ${{ runner.temp }}/agentre-bindings-keychain
        run: |
          mkdir -m 700 "$AGENTRE_KEYCHAIN_DIR"
          wails generate module
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      # vitest 走 esbuild，只转译不查类型。tsc 此前只挂在 build 上，类型错误要到
      # 打包那一刻才炸。这一步跟 Test 同一个 job，因为它要上面生成的 wailsjs 绑定。
      - name: Typecheck
        run: cd frontend && pnpm run typecheck
      - name: Test
        run: cd frontend && pnpm run test

  agentred-packaging:
    name: agentred Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify POSIX installer
        run: bash scripts/test-install.sh

  agentred-installer-windows:
    name: agentred Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify Windows agentred IPC and service management
        run: go test ./cmd/agentred ./internal/pkg/agentredipc
      - name: Verify PowerShell installer
        shell: pwsh
        run: scripts/test-install.ps1

  e2e:
    name: E2E
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          # node:sqlite (e2e DB oracle) is stable/unflagged on Node 24.
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails
          key: ${{ runner.os }}-wails-v2.12.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        run: cd e2e && pnpm install --frozen-lockfile

      - name: Install Playwright system deps
        run: cd e2e && pnpm exec playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd e2e && pnpm exec playwright install chromium

      - name: Run e2e
        run: xvfb-run -a make e2e

      - name: Upload per-run e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            e2e/artifacts/*/
            e2e/playwright-report/
